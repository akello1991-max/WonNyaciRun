[phases.setup]
php = "8.3"
nodejs = "22"
nixPkgs = ["php83Extensions.pdo_mysql", "php83Extensions.pdo_sqlite", "php83Extensions.mbstring", "php83Extensions.curl", "php83Extensions.fileinfo", "php83Extensions.gd", "php83Extensions.zip"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader", "npm ci || npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "bash start.sh"
