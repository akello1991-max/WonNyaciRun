[build]
builder = "RAILPACK"

[[build.steps]]
name = "generate-env"
description = "Generate .env file from environment variables"
cmds = ["bash create-env.sh"]

[deploy]
startCommand = "bash start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 300
